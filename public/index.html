<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natal no Ar</title>
<meta name="description" content="Campanhas de Natal prontas para Instagram por R$ 89,90. Você coloca suas fotos e publica.">
<meta name="theme-color" content="#FBF8F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --fundo:#FBF8F3; --fundo-2:#F2ECE2; --superficie:#FFFFFF; --tinta:#111111; --suave:#55514A; --linha:#E2DACD;
  --cereja:#B3122E; --cereja-escuro:#8E0E24; --cereja-tinta:#FFFFFF; --ok:#1F5A3F; --marca-bg:#FBE7A8;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r:16px; --t:.28s; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 var(--sans);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;line-height:1.02}
h3{font-weight:800;line-height:1.2}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cereja);outline-offset:3px;border-radius:8px}
mark{background:var(--marca-bg);color:inherit;border-radius:4px;padding:0 3px}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.hint{font-size:.9rem;color:var(--suave)}
.lede{font-size:1.1rem;color:var(--suave)}
.link{color:var(--tinta);font-weight:700;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}

/* botões: principal cheio em cereja, secundário com contorno preto */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 24px;border-radius:99px;border:2px solid var(--cereja);background:var(--cereja);color:var(--cereja-tinta);font-weight:800;text-decoration:none;cursor:pointer;text-align:center;line-height:1.2;transition:background var(--t),transform var(--t),box-shadow var(--t);box-shadow:0 10px 22px -12px rgba(179,18,46,.75)}
.btn:hover{background:var(--cereja-escuro);border-color:var(--cereja-escuro)}
.btn:active{transform:translateY(1px)}
.btn.grande{min-height:58px;padding:15px 30px;font-size:1.08rem}
.btn.ghost{background:transparent;color:var(--tinta);border-color:var(--tinta);box-shadow:none}
.btn.ghost:hover{background:var(--tinta);color:var(--fundo)}
.btn.sm{min-height:42px;padding:8px 16px;font-size:.92rem;box-shadow:none}
.btn.block{width:100%}
.btn.claro{background:var(--fundo);color:var(--tinta);border-color:var(--fundo);box-shadow:none}
.btn.claro:hover{background:#fff}
.chip{border:1.5px solid var(--linha);background:var(--superficie);border-radius:99px;padding:8px 14px;font-weight:700;font-size:.92rem;cursor:pointer}
.chip.on{border-color:var(--tinta);background:var(--tinta);color:var(--fundo)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.selo{display:inline-flex;align-items:center;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:4px 10px;white-space:nowrap}
.selo.ok{background:#E2EFE6;color:var(--ok)}
.selo.prep{background:var(--fundo-2);color:var(--suave)}

/* topo */
.topo{position:sticky;top:0;z-index:20;background:rgba(251,248,243,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.marca{font-family:var(--serif);font-weight:600;font-size:1.3rem;text-decoration:none;white-space:nowrap}
.marca .estrela{color:var(--cereja);font-size:.9rem;vertical-align:2px;margin-right:2px}
.menu{display:flex;gap:2px}
.menu a{font-size:.88rem;font-weight:800;text-decoration:none;padding:8px 10px;border-radius:99px;white-space:nowrap}
.menu a.on,.menu a:hover{background:var(--fundo-2)}
@media (max-width:400px){.marca{font-size:1.15rem}.menu a{padding:8px 7px;font-size:.84rem}}

/* início */
.hero{display:grid;gap:22px;padding-block:26px 34px;align-items:center}
@media (min-width:900px){.hero{grid-template-columns:1.3fr .7fr;padding-block:64px 72px;gap:40px}}
.hero-txt{container-type:inline-size;min-width:0}
/* a linha mais longa ("Seu conteúdo vem pronto.") mede ~11,6em: o título ocupa a largura toda sem cortar */
.hero h1{font-size:clamp(1.6rem,7.2vw,3.6rem);font-size:min(8.45cqi,5.6rem)}
.hero h1 .l{display:block;white-space:nowrap}
.hero h1 em{font-style:italic;color:var(--cereja)}
.hero .lede{margin-top:14px;max-width:34ch}
.ctas{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:22px}

/* animação: foto entra na capa → preço → três cartões em leque (uma vez) */
.palco{position:relative;height:clamp(350px,100vw,470px);display:grid;justify-items:center;align-items:start;isolation:isolate;pointer-events:none;overflow:hidden;padding-top:4px}
.leque{position:absolute;inset:0;display:grid;place-items:center;z-index:0}
.lq{position:absolute;margin:0;width:38%;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--fundo-2);box-shadow:0 14px 28px -16px rgba(0,0,0,.55);border:4px solid #fff}
.lq img{width:100%;height:100%;object-fit:cover;display:block}
.lq figcaption{position:absolute;left:8px;bottom:8px;background:#fff;color:var(--tinta);font-weight:800;font-size:.8rem;border-radius:99px;padding:3px 9px}
.palco{--abre:62%;--desce:10%;--desce2:22%}
.lq1{transform:translate(calc(var(--abre) * -1),var(--desce)) rotate(-12deg)}
.lq2{transform:translate(0,var(--desce2)) rotate(0)}
.lq3{transform:translate(var(--abre),var(--desce)) rotate(12deg)}
.post{position:relative;z-index:1;width:min(60%,300px);background:#fff;border-radius:14px;box-shadow:0 26px 50px -24px rgba(0,0,0,.55);overflow:hidden}
.post-top{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:.78rem;font-weight:800}
.post-av{width:22px;height:22px;border-radius:50%;background:var(--cereja);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:.75rem}
.post-capa{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--fundo-2)}
.post-foto{width:100%;height:100%;object-fit:cover;display:block}
.post-capa::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(17,15,12,.85))}
.post-txt{position:absolute;left:12px;right:12px;bottom:12px;z-index:1;color:#fff;display:grid}
.post-tit{font-family:var(--serif);font-weight:600;font-size:clamp(1.05rem,4.4vw,1.5rem);line-height:1.05}
.post-preco{justify-self:start;margin-top:6px;background:var(--fundo);color:var(--tinta);font-weight:800;font-size:clamp(1rem,4vw,1.35rem);border-radius:99px;padding:3px 12px}
@media (min-width:900px){.palco{height:600px;--abre:58%;--desce:52%;--desce2:62%}.post{width:min(74%,340px)}.lq{width:42%}}
@keyframes post-in{from{opacity:0;transform:translateY(6%) scale(.94)}to{opacity:1;transform:none}}
@keyframes foto-in{from{opacity:0;transform:translateY(18%) scale(1.25)}to{opacity:1;transform:none}}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes preco-in{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes l1{from{opacity:0;transform:translate(0,0) rotate(0)}to{opacity:1;transform:translate(calc(var(--abre) * -1),var(--desce)) rotate(-12deg)}}
@keyframes l2{from{opacity:0;transform:translate(0,0)}to{opacity:1;transform:translate(0,var(--desce2))}}
@keyframes l3{from{opacity:0;transform:translate(0,0) rotate(0)}to{opacity:1;transform:translate(var(--abre),var(--desce)) rotate(12deg)}}
.palco:not(.pronto) .post{animation:post-in .45s ease-out both}
.palco:not(.pronto) .post-foto{animation:foto-in .8s .25s cubic-bezier(.2,.75,.25,1) both}
.palco:not(.pronto) .post-tit{animation:sobe .4s .9s ease-out both}
.palco:not(.pronto) .post-preco{animation:preco-in .45s 1.25s cubic-bezier(.3,1.4,.5,1) both}
.palco:not(.pronto) .lq1{animation:l1 .6s 1.8s cubic-bezier(.2,.8,.25,1) both}
.palco:not(.pronto) .lq2{animation:l2 .6s 1.9s cubic-bezier(.2,.8,.25,1) both}
.palco:not(.pronto) .lq3{animation:l3 .6s 2s cubic-bezier(.2,.8,.25,1) both}

/* campanhas (início) */
.bloco{padding-block:40px}
.sec-cab{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;margin-bottom:16px}
.sec-cab h2{font-size:clamp(2rem,8vw,3.2rem)}
.preco-tag{font-weight:800;font-size:1.1rem;color:var(--cereja)}
.sub-t{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,6vw,2.2rem);letter-spacing:-.015em;margin-bottom:14px}
.publicos{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1.5px solid var(--linha);border-radius:26px;background:var(--superficie)}
.publicos button{border:0;background:none;border-radius:99px;padding:10px 18px;font-weight:800;cursor:pointer;transition:background var(--t),color var(--t)}
.publicos button[aria-selected="true"]{background:var(--tinta);color:var(--fundo)}
.pub-chamada{color:var(--suave);margin:12px 0 18px}
.destaque-camp{display:grid;grid-template-columns:38% 1fr;gap:0;text-decoration:none;background:var(--superficie);border:2px solid var(--tinta);border-radius:var(--r);overflow:hidden;margin-bottom:14px;transition:transform var(--t),box-shadow var(--t)}
.destaque-camp:hover{transform:translateY(-2px);box-shadow:0 16px 30px -20px rgba(0,0,0,.6)}
.destaque-camp img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/5;display:block}
.dc-txt{display:flex;flex-direction:column;gap:6px;padding:14px;align-items:flex-start}
.dc-txt b{font-family:var(--serif);font-weight:600;font-size:1.35rem;line-height:1.05}
.dc-txt>span:not(.selo):not(.dc-ir){color:var(--suave);font-size:.92rem}
.dc-ir{margin-top:auto;font-weight:800;color:var(--cereja)}
@media (min-width:760px){.destaque-camp{grid-template-columns:260px 1fr}.dc-txt{padding:24px}.dc-txt b{font-size:1.8rem}}
.lista-prep{list-style:none;margin:0;padding:0;border-top:1px solid var(--linha)}
.lista-prep li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linha)}
.lista-prep b{display:block}
.lista-prep span:not(.selo){display:block;color:var(--suave);font-size:.86rem}

/* "Ver tudo que vem no kit": botão de destaque + vitrine dos materiais */
.kit{margin-top:24px;border-radius:20px;background:var(--superficie);box-shadow:0 0 0 2px var(--cereja),0 18px 40px -26px rgba(179,18,46,.7);overflow:hidden}
.kit summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:14px;padding:14px 16px;background:linear-gradient(120deg,#FFF4F1,#FDE7E3);transition:background var(--t)}
.kit summary::-webkit-details-marker{display:none}
.kit summary:hover{background:linear-gradient(120deg,#FFEDE8,#FAD9D3)}
.kit-fotos{display:flex;flex:none}
.kit-fotos img{width:38px;height:48px;object-fit:cover;border-radius:7px;border:2px solid #fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.kit-fotos img:nth-child(1){transform:rotate(-8deg)}
.kit-fotos img:nth-child(2){margin-left:-14px;transform:translateY(-3px);z-index:1}
.kit-fotos img:nth-child(3){margin-left:-14px;transform:rotate(8deg)}
.kit-chamada{flex:1;display:grid;min-width:0}
.kit-chamada b{font-family:var(--serif);font-weight:600;font-size:1.25rem;line-height:1.1;color:var(--tinta)}
.kit-chamada span{font-size:.86rem;font-weight:800;color:var(--cereja);white-space:nowrap}
.kit-seta{flex:none;width:42px;height:42px;border-radius:50%;background:var(--cereja);color:#fff;display:grid;place-items:center;font-size:1.25rem;font-weight:800;transition:transform var(--t);box-shadow:0 6px 14px -6px rgba(179,18,46,.9)}
.kit:not([open]) .kit-seta{animation:chama 2.4s ease-in-out 1.5s 3}
@keyframes chama{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.kit[open] .kit-seta{transform:rotate(180deg)}
.kit-corpo{padding:20px 16px 18px}
.kit-intro{font-family:var(--serif);font-weight:600;font-size:1.45rem;line-height:1.15;margin-bottom:16px}
.kit-intro em{color:var(--cereja)}
.kit-grade{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:12px}
@media (min-width:700px){.kit-grade{grid-template-columns:1fr 1fr}.kit-item.largo{grid-column:1 / -1;grid-template-columns:260px 1fr}}
@media (min-width:1000px){.kit-grade{grid-template-columns:repeat(3,1fr)}.kit-item.largo{grid-column:span 3}}
.kit-item{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center;background:var(--fundo);border:1px solid var(--linha);border-radius:16px;padding:12px}
.kit[open] .kit-item{animation:sobe-kit .45s cubic-bezier(.2,.75,.25,1) both}
.kit[open] .kit-item:nth-child(2){animation-delay:.06s}.kit[open] .kit-item:nth-child(3){animation-delay:.12s}.kit[open] .kit-item:nth-child(4){animation-delay:.18s}.kit[open] .kit-item:nth-child(5){animation-delay:.24s}.kit[open] .kit-item:nth-child(6){animation-delay:.3s}
@keyframes sobe-kit{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kt{display:grid;gap:2px;min-width:0}
.kn{font-family:var(--serif);font-style:italic;font-weight:600;font-size:2.2rem;line-height:.9;color:var(--cereja)}
.kt b{font-size:1.05rem;line-height:1.2}
.ks{font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--suave)}
.kt p{font-size:.9rem;color:var(--suave);margin-top:4px}
.kv{height:132px;display:grid;place-items:center;border-radius:12px;background:var(--fundo-2);overflow:hidden;position:relative}
/* miniaturas */
.v-car{position:relative;width:100%;height:100%}
.v-car img{position:absolute;top:50%;left:50%;width:54%;aspect-ratio:4/5;object-fit:cover;border-radius:7px;border:2px solid #fff;box-shadow:0 6px 12px -6px rgba(0,0,0,.5)}
.v-car img:nth-child(1){transform:translate(-92%,-46%) rotate(-10deg)}
.v-car img:nth-child(2){transform:translate(-50%,-54%);z-index:1}
.v-car img:nth-child(3){transform:translate(-8%,-46%) rotate(10deg)}
.v-tel{position:relative;height:118px;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#111;box-shadow:0 6px 14px -6px rgba(0,0,0,.6)}
.v-tel img{width:100%;height:100%;object-fit:cover;opacity:.9}
.v-play{position:absolute;inset:0;margin:auto;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--cereja);display:grid;place-items:center;font-size:.7rem;padding-left:2px}
.v-cap{position:absolute;left:4px;right:4px;bottom:5px;color:#fff;font-size:.5rem;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.v-barras{position:absolute;top:4px;left:4px;right:4px;display:flex;gap:2px}
.v-barras i{flex:1;height:2px;background:rgba(255,255,255,.55);border-radius:2px}
.v-barras i:first-child{background:#fff}
.v-poll{position:absolute;left:5px;right:5px;bottom:12px;display:grid;gap:3px;background:#fff;border-radius:6px;padding:4px}
.v-poll i{position:relative;font-style:normal;font-size:.45rem;font-weight:800;color:var(--tinta);padding:2px 3px;border-radius:3px;overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,#F2C4CD var(--p),#fff var(--p))}
.v-wa{width:100%;height:100%;background:#EFE6DC;padding:10px 8px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.v-wa .b{max-width:88%;font-size:.6rem;font-weight:600;line-height:1.25;padding:5px 7px;border-radius:9px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.v-wa .in{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.v-wa .out{background:#DCF8C6;align-self:flex-end;border-top-right-radius:2px}
.v-cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:8px;width:100%}
.v-cal span{aspect-ratio:1;border-radius:5px;background:#fff;display:grid;place-items:center;font-size:.62rem;font-weight:800;color:var(--suave);border:1px solid var(--linha)}
.v-cal span.x{background:var(--cereja);color:#fff;border-color:var(--cereja)}
.v-tut{display:grid;gap:4px;padding:8px;width:100%}
.v-tut span{background:#fff;border-radius:6px;padding:4px 6px;font-size:.56rem;line-height:1.25;font-weight:700;color:var(--tinta);border:1px solid var(--linha)}
@media (min-width:700px){.kit-item{grid-template-columns:1fr;align-items:start}.kv{height:150px}.v-tel{height:136px}}
@media (min-width:700px){.kit-item.largo .kv{height:170px}}
.kit-total{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;background:var(--tinta);color:var(--fundo);border-radius:16px;padding:16px 18px;margin-bottom:18px}
.kit-total div{display:flex;align-items:center;gap:12px}
.kt-num{font-family:var(--serif);font-style:italic;font-weight:600;font-size:2.6rem;line-height:1;color:#FF8FA3}
.kit-total div span:last-child{font-weight:700;max-width:18ch;line-height:1.25}
.kit-total b{font-size:1.15rem}
.kit-comprar{margin-top:18px}
.dentro{list-style:none;margin:0 0 18px;padding:0}
.passos{list-style:none;counter-reset:p;margin:0;padding:0;display:grid;gap:12px}
@media (min-width:760px){.passos{grid-template-columns:repeat(4,1fr)}}
.passos li{counter-increment:p}
.passos li::before{content:counter(p);font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.6rem;color:var(--cereja);display:block;line-height:1}
.passos b{display:block}
.passos span{color:var(--suave);font-size:.93rem}
.trechos-t{margin:22px 0 10px;font-size:1.05rem}
.trechos{display:grid;gap:10px}
@media (min-width:760px){.trechos{grid-template-columns:repeat(3,1fr)}}
.trecho{background:var(--fundo);border:1px solid var(--linha);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start;position:relative;overflow:hidden;font-size:.94rem}
.trecho ul{margin:0;padding-left:18px;display:grid;gap:4px}
.convite{margin-top:22px;color:var(--suave);font-size:.94rem}
.convite a{color:var(--tinta);font-weight:800}

/* gestão */
.gestao{background:var(--tinta);color:var(--fundo);padding-block:48px}
.gestao h2{font-size:clamp(1.9rem,7.5vw,3.2rem)}
.gestao-txt{max-width:44ch;margin:12px 0 22px;font-size:1.08rem;color:#D9D4CB}
.aviso{background:rgba(255,255,255,.08);border:1px dashed currentColor;border-radius:12px;padding:12px 14px;max-width:52ch}

/* página da campanha */
.camp-top{padding-block:14px 8px}
.camp-top h1{font-size:clamp(1.55rem,6.9vw,3.4rem);margin:2px 0 12px}
.carrossel{display:grid;grid-auto-flow:column;grid-auto-columns:84%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px;scroll-padding-inline:16px}
.carrossel::-webkit-scrollbar{display:none}
@media (min-width:700px){.carrossel{grid-auto-columns:44%}}
@media (min-width:1000px){.carrossel{grid-auto-columns:calc(31% - 6px);margin-inline:0;padding-inline:0}}
.car-item{margin:0;scroll-snap-align:start}
.car-item canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;border-radius:12px;box-shadow:0 16px 30px -20px rgba(0,0,0,.65);background:var(--fundo-2)}
.car-rodape{display:flex;align-items:center;gap:12px;margin-top:8px}
.car-pontos{display:flex;gap:6px}
.car-pontos span{width:8px;height:8px;border-radius:50%;background:var(--linha);transition:background var(--t),transform var(--t)}
.car-pontos span.on{background:var(--tinta);transform:scale(1.25)}
.car-cont{font-size:.85rem;font-weight:700;color:var(--suave)}
.car-setas{margin-left:auto;display:flex;gap:6px}
.car-setas button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--tinta);background:var(--superficie);font-size:1.4rem;line-height:1;cursor:pointer}
.car-setas button:disabled{opacity:.3;cursor:default}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.acoes .btn{flex:1 1 220px}
.topo-pag{padding-block:22px 10px}
.topo-pag h1{font-size:clamp(2rem,8vw,3.4rem);margin-top:6px}
.topo-pag .lede{margin-top:10px;max-width:46ch}
.voltar{display:inline-block;margin-bottom:12px;font-size:.92rem}

/* Reel e Stories */
.demo{display:grid;gap:12px;max-width:440px}
.demo-abas{display:flex;gap:4px;padding:4px;border:1.5px solid var(--linha);border-radius:99px;background:var(--superficie);justify-self:start}
.demo-abas button{border:0;background:none;border-radius:99px;padding:9px 20px;font-weight:800;cursor:pointer;transition:background var(--t),color var(--t)}
.demo-abas button[aria-selected="true"]{background:var(--tinta);color:var(--fundo)}
.demo-produtos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.dp{display:flex;align-items:center;gap:8px;border:2px solid var(--linha);background:var(--superficie);border-radius:12px;padding:5px 12px 5px 5px;cursor:pointer;font-weight:700;font-size:.86rem;white-space:nowrap;transition:border-color var(--t)}
.dp img{width:34px;height:42px;object-fit:cover;border-radius:6px}
.dp[aria-checked="true"]{border-color:var(--tinta)}
.demo-palco.troca .tel9{animation:troca .3s ease-out}
@keyframes troca{from{opacity:.4}to{opacity:1}}
.fmt.entra{animation:entra .28s ease-out both}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.demo-nota{color:var(--suave);font-size:.9rem;min-height:1.4em}
.tel9{position:relative;width:min(100%,330px);aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#111;color:#fff;box-shadow:0 18px 36px -22px rgba(0,0,0,.8)}
.tel9-rotulo{position:absolute;left:14px;bottom:12px;font-size:.78rem;font-weight:700;opacity:.85;z-index:3}
.reel-barras,.st-barras{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:4}
.reel-barras button{flex:1;height:14px;border:0;background:none;padding:5px 0;cursor:pointer}
.reel-barras i,.st-barras span{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden;position:relative}
.st-barras span{flex:1}
.reel-barras i::after,.st-barras span::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.reel-barras .feito i::after,.st-barras .feito::after,.st-barras .agora::after{transform:scaleX(1)}
.reel-barras .agora i::after{animation:barra 2.8s linear forwards}
@keyframes barra{to{transform:scaleX(1)}}
.cena{position:absolute;inset:0;opacity:0;transition:opacity .45s ease}
.cena.on{opacity:1}
.cena img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.cena.on img{animation:kenburns 3.2s ease-out forwards}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.cena::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.65))}
.cena-txt{position:absolute;left:14px;right:14px;bottom:44px;z-index:2;font-family:var(--serif);font-weight:600;font-size:1.5rem;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.cena-gravar{font-size:.92rem;color:var(--suave)}
.st .st-quem{position:absolute;top:22px;left:12px;z-index:4;font-size:.8rem}
.st-f{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
.st-f.on{opacity:1;visibility:visible;transition:opacity .35s ease}
.st-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.62)}
.st-cx{position:absolute;inset:56px 14px 20px;display:flex;flex-direction:column;justify-content:center;gap:12px;z-index:2}
.st-cx.fim{justify-content:flex-end;padding-bottom:20px}
.st-perg,.st-nome{font-family:var(--serif);font-weight:600;font-size:1.45rem;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.enquete{display:grid;gap:8px;background:rgba(255,255,255,.96);color:var(--tinta);border-radius:14px;padding:10px}
.opc{position:relative;display:flex;align-items:center;gap:10px;border:1.5px solid var(--linha);background:#fff;border-radius:10px;padding:6px 10px 6px 6px;cursor:pointer;overflow:hidden;font-weight:700;text-align:left;z-index:5}
.opc img{width:34px;height:42px;object-fit:cover;border-radius:5px;position:relative}
.opc-nome{flex:1;position:relative;font-size:.92rem}
.opc-pct{position:relative;font-weight:800;color:var(--cereja)}
.opc-bar{position:absolute;inset:0 auto 0 0;width:0;background:#F7E1E5;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.opc.escolha{border-color:var(--cereja)}
.opc.escolha .opc-bar{background:#F2C4CD}
.opc.votado{cursor:default}
.st-link{align-self:flex-start;background:#fff;color:var(--tinta);border-radius:10px;padding:8px 12px;font-weight:800;font-size:.92rem}
.st-toque{position:absolute;top:56px;bottom:0;width:30%;border:0;background:none;z-index:3;cursor:pointer}
.st-toque.ant{left:0}.st-toque.prox{right:0}

/* revisão do pedido */
.pedido{max-width:560px}
.recibo{margin:18px 0 14px;background:var(--superficie);border:1.5px solid var(--linha);border-radius:var(--r);padding:16px}
.rc-linha,.rc-total{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rc-linha small{display:block;color:var(--suave);font-size:.86rem}
.rc-itens{margin:12px 0;padding-left:18px;color:var(--suave);font-size:.93rem;display:grid;gap:3px}
.rc-total{border-top:1px solid var(--linha);padding-top:12px;font-size:1.15rem}
.aviso-pedido{background:var(--fundo-2);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.95rem}

/* editores */
.am-grade{display:grid;gap:18px}
@media (min-width:860px){.am-grade{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.am-previa{margin:0;max-width:460px}
.am-previa canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;border-radius:12px;box-shadow:0 18px 36px -22px rgba(0,0,0,.7)}
.am-previa figcaption{margin-top:8px}
.ed-modelos{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.ed-grade{display:grid;gap:18px}
@media (min-width:980px){.ed-grade{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"previa previa" "painel legenda"}.ed-previa{grid-area:previa}.ed-painel{grid-area:painel}.ed-legenda{grid-area:legenda}}
.ed-telas{display:grid;grid-auto-flow:column;grid-auto-columns:84%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 10px;margin-inline:-4px}
@media (min-width:640px){.ed-telas{grid-auto-columns:46%}}
@media (min-width:980px){.ed-telas{grid-auto-columns:calc(25% - 8px)}}
.ed-tela{border:0;padding:0;background:none;scroll-snap-align:start;cursor:pointer;text-align:left}
.ed-tela canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;border-radius:10px;box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.ed-tela span{display:block;font-size:.85rem;font-weight:700;color:var(--suave);margin-top:6px}
.ed-tela.on canvas{outline:3px solid var(--cereja);outline-offset:3px}
.ed-tela.on span{color:var(--cereja)}
.ed-painel{background:var(--superficie);border:1.5px solid var(--linha);border-radius:var(--r);padding:16px;display:grid;gap:14px;align-content:start}
.ed-abas{display:flex;gap:6px;flex-wrap:wrap}
.ed-abas button{border:1.5px solid var(--linha);background:var(--fundo);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer}
.ed-abas button[aria-selected="true"]{background:var(--tinta);color:var(--fundo);border-color:var(--tinta)}
.ed-foto{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.arquivo{position:relative;overflow:hidden}
.arquivo input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.ed-ajuste{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.campo{display:grid;gap:4px}
.campo span{font-size:.86rem;font-weight:700}
.campo input:not([type=range]){width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--linha);border-radius:12px;background:var(--fundo);color:var(--tinta);min-width:0}
.campo.mini span{font-size:.76rem;color:var(--suave)}
.campo input[type=range]{width:100%;accent-color:var(--cereja)}
.ed-legenda{background:var(--superficie);border:1.5px solid var(--linha);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.legenda-txt{white-space:pre-wrap;font:inherit;font-size:.95rem;margin:0;max-height:320px;overflow:auto}
.ed-baixar{margin-top:20px;background:var(--superficie);border:1.5px solid var(--linha);border-radius:var(--r);padding:16px}
.ed-botoes{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 6px}

/* área da cliente */
.ideia{margin-bottom:12px}
.aviso-reel{display:inline-block;background:var(--marca-bg);border-radius:8px;padding:6px 10px;font-weight:700;font-size:.92rem;margin-bottom:10px}
.roteiro{display:grid;gap:4px;margin:0}
@media (min-width:640px){.roteiro{grid-template-columns:150px 1fr;gap:10px 16px}}
.roteiro dt{font-weight:800;font-size:.84rem;letter-spacing:.04em;text-transform:uppercase;color:var(--suave)}
.roteiro dd{margin:0 0 8px}
.roteiro ol{margin:0;padding-left:20px;display:grid;gap:8px}
.tt{color:var(--suave);font-size:.92rem}
.stories-txt{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:760px){.stories-txt{grid-template-columns:repeat(3,1fr)}}
.stories-txt li{background:var(--fundo);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.stories-txt .n{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.stories-txt small{color:var(--suave)}
.msgs{display:grid;gap:12px}
@media (min-width:760px){.msgs{grid-template-columns:repeat(3,1fr)}}
.msg{background:var(--fundo);border:1px solid var(--linha);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cal{list-style:none;margin:0 0 12px;padding:0;border-top:1px solid var(--linha)}
.cal>li{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--linha)}
.cal .dia{font-family:var(--serif);font-weight:600;font-size:1.1rem}
.cal ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.cal .tipo{display:inline-block;min-width:76px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cereja)}

/* planos (compra única) */
.planos-sec{padding-top:28px}
.planos{display:grid;gap:12px;margin:14px 0 16px}
@media (min-width:760px){.planos{grid-template-columns:repeat(3,1fr)}}
.plano{position:relative;background:var(--superficie);border:2px solid var(--linha);border-radius:18px;padding:16px;cursor:pointer;display:grid;gap:8px;align-content:start;transition:border-color var(--t),box-shadow var(--t),transform var(--t)}
.plano:hover{border-color:#C9BFAF}
.plano.on{border-color:var(--cereja);box-shadow:0 16px 34px -22px rgba(179,18,46,.8);transform:translateY(-2px)}
.pl-topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl-nome{font-family:var(--serif);font-weight:600;font-size:1.35rem;line-height:1.1}
.pl-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--linha);flex:none;display:grid;place-items:center;transition:background var(--t),border-color var(--t)}
.plano.on .pl-check{background:var(--cereja);border-color:var(--cereja)}
.plano.on .pl-check::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pl-preco{font-weight:800;font-size:1.65rem;color:var(--cereja);line-height:1}
.pl-nums{display:flex;flex-wrap:wrap;gap:6px}
.pl-nums span{background:var(--fundo-2);border-radius:99px;padding:4px 10px;font-size:.84rem;font-weight:600}
.pl-nums b{font-weight:800}
.pl-resumo{font-size:.92rem;color:var(--suave)}
.pl-mais{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.9rem}
.pl-mais li{padding-left:20px;position:relative}
.pl-mais li::before{content:"✦";position:absolute;left:0;color:var(--cereja);font-size:.75rem;top:2px}
.pl-acao{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;background:rgba(251,248,243,.96);backdrop-filter:blur(6px);border:1.5px solid var(--linha);border-radius:18px;padding:8px 10px 10px;display:grid;gap:6px;box-shadow:0 12px 30px -18px rgba(0,0,0,.45)}
.pl-acao .btn.grande{min-height:52px;padding:12px 18px;font-size:1rem}
.pl-escolhido{font-size:.86rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-escolhido b{font-weight:800}
.pl-escolhido .num{font-weight:800;color:var(--cereja)}
.pub-pergunta{font-weight:800;margin-bottom:8px}
.dc-planos{font-size:.85rem;font-weight:700;color:var(--tinta)}
/* área da cliente */
.grupo-t{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);margin:10px 0 6px}
.kit-det{margin-top:14px;border:1.5px solid var(--linha);border-radius:var(--r);background:var(--superficie)}
.kit-det summary{cursor:pointer;padding:14px 16px;font-weight:800}
.kit-det-corpo{padding:0 16px 16px}
/* vitrine: miniaturas extras */
.v-cal .mais{grid-column:span 5;aspect-ratio:auto;padding:3px;background:var(--tinta);color:#fff;border-color:var(--tinta)}
.v-lista{display:grid;gap:5px;padding:10px;width:100%}
.v-lista span{border-radius:8px;padding:6px 8px;font-size:.62rem;font-weight:800;line-height:1.2;color:#fff;background:var(--cereja)}
.v-lista.virada span{background:linear-gradient(120deg,#2A2230,#5A4466);color:#F6E3B4}
.rc-linha small{display:block;color:var(--suave);font-size:.8rem}
.rc-plano{margin-top:10px;padding-top:10px;border-top:1px solid var(--linha)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:var(--fundo);border-radius:99px;padding:10px 18px;font-weight:700;font-size:.92rem;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
footer{padding-block:26px;color:var(--suave);font-size:.85rem;border-top:1px solid var(--linha)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
