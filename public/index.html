<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natal no Ar</title>
<meta name="description" content="Campanhas de Natal prontas para Instagram por R$ 89,90. Carrosséis, roteiros de Reels e calendário já preparados: você coloca suas fotos, adapta os textos e publica.">
<meta name="theme-color" content="#F4EFE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --papel:#F4EFE6; --papel-2:#EBE4D7; --superficie:#FFFDF8; --tinta:#1C1B18; --suave:#5B564D; --linha:#DDD4C5;
  --pinho:#1F4A38; --pinho-escuro:#163628; --pinho-tinta:#FFFFFF; --baga:#A3262A; --ouro:#B08A4E; --marca-bg:#F6E7B8;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--papel);color:var(--tinta);font:17px/1.55 var(--sans);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;line-height:1.04}
h3{font-weight:800;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--baga);outline-offset:3px;border-radius:6px}
mark{background:var(--marca-bg);color:inherit;border-radius:4px;padding:0 3px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.estrela{color:var(--baga)}
.hint{font-size:.88rem;color:var(--suave)}
.link{color:var(--pinho);font-weight:700;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:99px;border:2px solid var(--pinho);background:var(--pinho);color:var(--pinho-tinta);font-weight:700;text-decoration:none;cursor:pointer;text-align:center;line-height:1.2}
.btn:hover{background:var(--pinho-escuro);border-color:var(--pinho-escuro)}
.btn.ghost{background:transparent;color:var(--pinho)}
.btn.ghost:hover{background:var(--papel-2)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:.92rem}
.btn.block{width:100%}
.btn.grande{min-height:56px;padding:14px 28px;font-size:1.06rem}
.btn.claro{background:var(--papel);color:var(--pinho-escuro);border-color:var(--papel)}
.btn.espera,.btn.espera:hover{background:var(--papel-2);color:var(--suave);border-color:var(--linha);cursor:default}
.chip{border:1.5px solid var(--linha);background:var(--superficie);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.92rem;cursor:pointer}
.chip.on{border-color:var(--pinho);background:var(--pinho);color:var(--pinho-tinta)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.selo{display:inline-flex;align-items:center;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:4px 10px;white-space:nowrap}
.selo.ok{background:#DDEBDD;color:var(--pinho-escuro)}
.selo.prep{background:var(--papel-2);color:var(--suave);border:1px dashed var(--linha)}

/* topo */
.topo{position:sticky;top:0;z-index:20;background:rgba(244,239,230,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
.marca{font-family:var(--serif);font-weight:600;font-size:1.3rem;text-decoration:none;white-space:nowrap;letter-spacing:-.01em}
.marca .estrela{font-size:.9rem;margin-right:2px;vertical-align:2px}
.menu{display:flex;gap:4px}
.menu a{font-size:.88rem;font-weight:700;text-decoration:none;padding:8px 10px;border-radius:99px;white-space:nowrap}
.menu a.on,.menu a:hover{background:var(--papel-2)}
@media (max-width:520px){.menu .largo{display:none}}

/* primeira tela */
.hero{padding-block:28px 26px}
.hero .eyebrow{margin-bottom:14px}
.hero h1{font-size:clamp(2rem,8.4vw,5rem);text-wrap:wrap}
.hero h1 .l{display:block}
.hero h1 em{font-style:italic;color:var(--baga);background:linear-gradient(transparent 72%,var(--marca-bg) 72%,var(--marca-bg) 92%,transparent 92%);padding:0 .06em}
.hero .lede{font-size:1.06rem;max-width:42ch;margin-top:16px;color:var(--suave)}
.ctas{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:22px}
@media (min-width:860px){.hero{padding-block:64px 48px}.hero .lede{font-size:1.2rem}}

/* amostra antes/depois */
.amostra{background:var(--papel-2);padding-block:32px;border-block:1px solid var(--linha)}
.sec-cab{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 24px;margin-bottom:18px}
.sec-cab h2{font-size:clamp(1.7rem,6.4vw,2.6rem)}
.sec-cab p{color:var(--suave);max-width:46ch}
.ad{display:grid;grid-auto-flow:column;grid-auto-columns:82%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-4px;padding-inline:4px}
@media (min-width:760px){.ad{grid-auto-columns:1fr;max-width:820px}}
.ad-item{margin:0;scroll-snap-align:start}
.ad-item canvas,.ed-tela canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;border-radius:10px;background:var(--papel);box-shadow:0 14px 30px -18px rgba(28,27,24,.6)}
.ad-item figcaption{font-size:.9rem;color:var(--suave);margin-top:8px}
.ad-item figcaption b{color:var(--tinta);margin-right:6px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.amostra-acao{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:18px}

/* campanhas */
.bloco{padding-block:40px}
.bloco .eyebrow{margin-bottom:8px}
.preco{color:var(--baga);white-space:nowrap}
.respostas{display:grid;gap:10px;margin:6px 0 10px}
@media (min-width:760px){.respostas{grid-template-columns:repeat(3,1fr)}}
.resposta{display:block;text-decoration:none;background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r);padding:14px 16px}
.resposta b{display:block;font-size:1.02rem}
.resposta span{display:block;color:var(--suave);font-size:.92rem;margin-top:2px}
.sub-bloco{padding-top:30px}
.sub-t{font-family:var(--serif);font-weight:600;font-size:clamp(1.45rem,5.4vw,2rem);letter-spacing:-.01em;margin-bottom:14px}
.publicos{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1.5px solid var(--linha);border-radius:24px;background:var(--superficie)}
.publicos button{border:0;background:none;border-radius:99px;padding:10px 18px;font-weight:800;cursor:pointer}
.publicos button[aria-selected="true"]{background:var(--tinta);color:var(--papel)}
.pub-chamada{color:var(--suave);margin:12px 0 16px}
.temas{display:grid;gap:12px}
@media (min-width:760px){.temas{grid-template-columns:repeat(2,1fr)}}
.tema{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tema.pronto{border:2px solid var(--pinho);box-shadow:0 18px 40px -30px rgba(31,74,56,.8)}
.tema.prep{background:transparent}
.tema-topo{display:flex;justify-content:space-between;align-items:start;gap:10px}
.tema h3{font-size:1.15rem}
.tema p{color:var(--suave);font-size:.96rem}
.tema .para{color:var(--tinta);font-size:.92rem}
.tema-acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.dentro{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--linha)}
@media (min-width:760px){.dentro{grid-template-columns:1fr 1fr;column-gap:32px}}
.dentro li{padding:14px 0 14px 30px;border-bottom:1px solid var(--linha);position:relative}
.dentro li::before{content:"✦";position:absolute;left:4px;top:15px;color:var(--baga);font-size:.85rem}
.dentro b{display:block}
.dentro span{color:var(--suave);font-size:.95rem}
.passos{list-style:none;counter-reset:p;margin:0 0 18px;padding:0;display:grid;gap:14px}
@media (min-width:760px){.passos{grid-template-columns:repeat(4,1fr)}}
.passos li{counter-increment:p}
.passos li::before{content:counter(p);font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.8rem;color:var(--baga);display:block;line-height:1;margin-bottom:4px}
.passos b{display:block}
.passos span{color:var(--suave);font-size:.95rem}
.convite{margin-top:30px;padding-top:16px;border-top:1px dashed var(--linha);color:var(--suave);font-size:.94rem}
.convite a{color:var(--pinho);font-weight:700}

/* gestão */
.gestao{background:var(--pinho-escuro);color:var(--papel);padding-block:44px}
.gestao .eyebrow{color:#C9D8CC;margin-bottom:10px}
.gestao h2{font-size:clamp(1.9rem,7vw,3rem)}
.gestao-txt{max-width:52ch;margin:14px 0 22px;font-size:1.05rem;color:#E4ECE3}
.aviso{background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.4);border-radius:12px;padding:12px 14px;max-width:52ch}

/* campanha */
.camp-cab{padding-block:22px 6px}
.voltar{display:inline-block;margin-bottom:14px}
.camp-cab h1{font-size:clamp(2rem,8vw,3.4rem);margin-top:8px}
.camp-cab .lede{color:var(--suave);max-width:52ch;margin-top:10px}
.camp-cab .hint{margin-top:10px}
.tema-det h3{margin:26px 0 10px;font-size:1.08rem}
.ideia{font-size:1.02rem}
.tema-det .hint{margin-top:6px}
.telas-txt,.stories-txt{list-style:none;margin:0;padding:0;display:grid;gap:10px}
@media (min-width:760px){.telas-txt{grid-template-columns:repeat(4,1fr)}.stories-txt{grid-template-columns:repeat(3,1fr)}}
.telas-txt li,.stories-txt li{background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.telas-txt .n,.stories-txt .n{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.telas-txt .pr{font-weight:800}
.telas-txt small,.stories-txt small{color:var(--suave);font-size:.84rem}
.legenda-box{background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:14px;margin-top:12px}
.lb-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.aviso-reel{display:inline-block;background:var(--marca-bg);border-radius:8px;padding:6px 10px;font-weight:600;font-size:.92rem;margin-bottom:10px}
.roteiro{display:grid;grid-template-columns:1fr;gap:4px;margin:0}
@media (min-width:640px){.roteiro{grid-template-columns:150px 1fr;gap:10px 16px}}
.roteiro dt{font-weight:800;font-size:.86rem;letter-spacing:.04em;text-transform:uppercase;color:var(--suave);padding-top:2px}
.roteiro dd{margin:0 0 8px}
.roteiro ol{margin:0;padding-left:20px;display:grid;gap:8px}
.tt{color:var(--suave);font-size:.92rem}
.msgs{display:grid;gap:12px}
@media (min-width:760px){.msgs{grid-template-columns:repeat(3,1fr)}}
.msg{background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cal{list-style:none;margin:0 0 12px;padding:0;border-top:1px solid var(--linha)}
.cal>li{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--linha)}
.cal .dia{font-family:var(--serif);font-weight:600;font-size:1.15rem}
.cal ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.cal .tipo{display:inline-block;min-width:76px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pinho)}

/* editor */
.ed-modelos{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 16px}
.ed-grade{display:grid;gap:20px}
@media (min-width:980px){.ed-grade{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"previa previa" "painel legenda"}.ed-previa{grid-area:previa}.ed-painel{grid-area:painel}.ed-legenda{grid-area:legenda}}
.ed-telas{display:grid;grid-auto-flow:column;grid-auto-columns:86%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 10px;margin-inline:-4px}
@media (min-width:640px){.ed-telas{grid-auto-columns:46%}}
@media (min-width:980px){.ed-telas{grid-auto-columns:calc(25% - 9px)}}
.ed-tela{border:0;padding:0;background:none;scroll-snap-align:start;cursor:pointer;text-align:left}
.ed-tela span{display:block;font-size:.85rem;font-weight:700;color:var(--suave);margin-top:6px}
.ed-tela.on canvas{outline:3px solid var(--pinho);outline-offset:3px}
.ed-tela.on span{color:var(--pinho)}
.ed-painel{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r);padding:16px;display:grid;gap:14px;align-content:start}
.ed-abas{display:flex;gap:6px;flex-wrap:wrap}
.ed-abas button{border:1.5px solid var(--linha);background:var(--papel);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer}
.ed-abas button[aria-selected="true"]{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.ed-campos{display:grid;gap:12px}
.ed-foto{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.arquivo{position:relative;overflow:hidden}
.arquivo input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.ed-ajuste{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.campo{display:grid;gap:4px}
.campo span{font-size:.86rem;font-weight:700}
.campo input:not([type=range]){width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--linha);border-radius:12px;background:var(--papel);color:var(--tinta);min-width:0}
.campo.mini span{font-size:.76rem;color:var(--suave)}
.campo input[type=range]{width:100%;accent-color:var(--pinho)}
.ed-legenda{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.legenda-txt{white-space:pre-wrap;font:inherit;font-size:.95rem;margin:0;max-height:320px;overflow:auto}
.ed-baixar{margin-top:22px;background:var(--superficie);border:1px solid var(--linha);border-radius:var(--r);padding:16px}
.ed-botoes{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 6px}
.depois-demo p{color:var(--suave);max-width:56ch}

/* demonstração */
.demo{display:grid;gap:14px}
.demo-produtos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dp{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--linha);background:var(--superficie);border-radius:12px;padding:8px 6px;cursor:pointer;text-align:center;transition:border-color .25s,transform .25s}
.dp img{width:56px;height:70px;object-fit:cover;border-radius:6px}
.dp b{display:block;font-size:.84rem;line-height:1.2}
.dp small{display:block;color:var(--suave);font-size:.8rem;font-weight:700}
.dp[aria-checked="true"]{border-color:var(--pinho);transform:translateY(-2px);box-shadow:0 10px 20px -16px rgba(31,74,56,.9)}
@media (min-width:640px){.dp{flex-direction:row;text-align:left;padding:8px 10px}}
.demo-abas{display:flex;gap:4px;padding:4px;border:1.5px solid var(--linha);border-radius:99px;background:var(--superficie);justify-self:start}
.demo-abas button{border:0;background:none;border-radius:99px;padding:9px 18px;font-weight:800;cursor:pointer;transition:background .25s,color .25s}
.demo-abas button[aria-selected="true"]{background:var(--tinta);color:var(--papel)}
.demo-palco{max-width:440px;width:100%}
.fmt.entra{animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.demo-nota{color:var(--suave);font-size:.92rem;min-height:1.5em}
.car{position:relative;overflow:hidden;border-radius:12px;touch-action:pan-y;user-select:none;box-shadow:0 18px 36px -22px rgba(28,27,24,.7);outline-offset:4px}
.car-trilho{display:flex;transition:transform .45s cubic-bezier(.2,.7,.2,1);will-change:transform}
.car-tela{flex:0 0 100%}
.car-tela canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;pointer-events:none}
.car-seta{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(246,241,232,.92);color:var(--tinta);font-size:1.6rem;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.car-seta.ant{left:8px}.car-seta.prox{right:8px}
.car-seta:disabled{opacity:0;pointer-events:none}
.car-pontos{display:flex;justify-content:center;gap:8px;margin-top:10px}
.car-pontos button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--linha);cursor:pointer;transition:background .25s,transform .25s}
.car-pontos button[aria-current="true"]{background:var(--pinho);transform:scale(1.3)}
.tel9{position:relative;width:min(100%,320px);aspect-ratio:9/16;margin:0 auto;border-radius:20px;overflow:hidden;background:#111;color:#fff;box-shadow:0 18px 36px -22px rgba(28,27,24,.8)}
.tel9-rotulo{position:absolute;left:14px;bottom:12px;font-size:.78rem;font-weight:700;opacity:.85;z-index:3}
.reel-barras,.st-barras{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:4}
.reel-barras button{flex:1;height:14px;border:0;background:none;padding:5px 0;cursor:pointer}
.reel-barras i,.st-barras span{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden;position:relative}
.st-barras span{flex:1}
.reel-barras i::after,.st-barras span::after{content:"";position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.reel-barras .feito i::after,.st-barras .feito::after{transform:scaleX(1)}
.reel-barras .agora i::after{animation:barra 2.8s linear forwards}
.st-barras .agora::after{transform:scaleX(1);transition:transform .4s}
@keyframes barra{to{transform:scaleX(1)}}
.cena{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
.cena.on{opacity:1}
.cena img{width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.cena.on img{animation:kenburns 3.2s ease-out forwards}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.14)}}
.cena::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.65))}
.cena-txt{position:absolute;left:14px;right:14px;bottom:44px;z-index:2;font-family:var(--serif);font-weight:600;font-size:1.5rem;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.5);transition:opacity .3s}
.cena-gravar{margin-top:10px;font-size:.92rem;color:var(--suave);max-width:440px}
.st .st-quem{position:absolute;top:22px;left:12px;z-index:4;font-size:.8rem}
.st-f{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
.st-f.on{opacity:1;visibility:visible;transition:opacity .45s ease}
.st-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.62)}
.st-cx{position:absolute;inset:56px 14px 20px;display:flex;flex-direction:column;justify-content:center;gap:12px;z-index:2}
.st-cx.fim{justify-content:flex-end;padding-bottom:20px}
.st-perg,.st-nome{font-family:var(--serif);font-weight:600;font-size:1.45rem;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.st-det{font-size:.98rem}
.enquete{display:grid;gap:8px;background:rgba(255,255,255,.95);color:var(--tinta);border-radius:14px;padding:10px}
.opc{position:relative;display:flex;align-items:center;gap:10px;border:1.5px solid var(--linha);background:#fff;border-radius:10px;padding:6px 10px 6px 6px;cursor:pointer;overflow:hidden;font-weight:700;text-align:left;z-index:5}
.opc img{width:34px;height:42px;object-fit:cover;border-radius:5px;position:relative}
.opc-nome{flex:1;position:relative;font-size:.92rem}
.opc-pct{position:relative;font-weight:800;color:var(--pinho)}
.opc-bar{position:absolute;inset:0 auto 0 0;width:0;background:#E3EEE3;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.opc.escolha{border-color:var(--pinho)}
.opc.escolha .opc-bar{background:#CFE3D2}
.opc.votado{cursor:default}
.st-link{align-self:flex-start;background:#fff;color:var(--tinta);border-radius:10px;padding:8px 12px;font-weight:800;font-size:.92rem}
.st-toque{position:absolute;top:56px;bottom:0;width:30%;border:0;background:none;z-index:3;cursor:pointer}
.st-toque.ant{left:0}.st-toque.prox{right:0}
.st-f[data-f="0"].on ~ .st-toque{bottom:auto;height:0}
.st-reset{margin-top:10px}
.testar-cta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:22px;padding:16px;border-radius:var(--r);background:var(--superficie);border:2px dashed var(--ouro)}
.btn.destaque{background:var(--baga);border-color:var(--baga)}
.btn.destaque:hover{background:#86191D;border-color:#86191D}
.compra{display:grid;gap:6px;justify-items:start;margin-top:4px}
.compra .hint{max-width:46ch}
.em-breve{margin-top:6px;font-size:.88rem;color:var(--suave);font-weight:600}
.em-breve span{color:var(--baga)}
.trechos-t{margin:30px 0 12px;font-size:1.1rem}
.trechos{display:grid;gap:12px}
@media (min-width:760px){.trechos{grid-template-columns:repeat(3,1fr)}}
.trecho{background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start;position:relative;overflow:hidden}
.trecho::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,var(--superficie))}
.trecho ul{margin:0;padding-left:18px;display:grid;gap:4px}
.trava{margin-top:14px;font-weight:600}
.am-grade{display:grid;gap:18px}
@media (min-width:860px){.am-grade{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.am-previa{margin:0;max-width:440px}
.am-previa canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;border-radius:12px;box-shadow:0 18px 36px -22px rgba(28,27,24,.7)}
.am-previa figcaption{margin-top:8px}
.am-passo{font-weight:800}
.am-passo b{color:var(--baga)}
@media (prefers-reduced-motion: reduce){.car-trilho,.cena,.st-f,.opc-bar{transition:none!important}.cena.on img,.reel-barras .agora i::after,.fmt.entra{animation:none!important}.reel-barras .agora i::after{transform:scaleX(1)}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:var(--papel);border-radius:99px;padding:10px 18px;font-weight:600;font-size:.92rem;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
footer{padding-block:28px;color:var(--suave);font-size:.85rem;border-top:1px solid var(--linha)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
