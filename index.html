<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natal no Ar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: revista de moda em coluna única no celular; capa = conteúdo pronto num post de carrossel; barra de pedido fixa embaixo. */
:root{
  --paper:#FBF4F6; --surface:#FFFFFF; --blush:#F4DCE4; --line:#E7CBD5;
  --ink:#2B0F24; --muted:#7A5670;
  --cherry:#B0123C; --cherry-ink:#FFFFFF; --plum:#5A1D4B; --gold:#9A6E22;
  --ok:#1E7A4F; --err:#B0123C;
  --phone:#140810; --ig-bg:#FFFFFF; --ig-ink:#141414; --ig-muted:#737373;
  --chat-bg:#EFE6E0; --bubble-in:#FFFFFF; --bubble-out:#DDF7D3; --chat-ink:#1B1B1B; --chat-meta:#6E7B83;
  --display:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#170A14; --surface:#22111E; --blush:#33182C; --line:#4A2440;
  --ink:#F8EAF0; --muted:#C29BB5;
  --cherry:#FF4F78; --cherry-ink:#2A0614; --plum:#E3A9D2; --gold:#E2BA72;
  --ok:#5ED39A; --err:#FF7C98;
  --phone:#05020A; --ig-bg:#000000; --ig-ink:#F5F5F5; --ig-muted:#A8A8A8;
  --chat-bg:#0E1A20; --bubble-in:#1F2C33; --bubble-out:#0B5A49; --chat-ink:#E9EDEF; --chat-meta:#8FA2AC;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#170A14; --surface:#22111E; --blush:#33182C; --line:#4A2440;
  --ink:#F8EAF0; --muted:#C29BB5;
  --cherry:#FF4F78; --cherry-ink:#2A0614; --plum:#E3A9D2; --gold:#E2BA72;
  --ok:#5ED39A; --err:#FF7C98;
  --phone:#05020A; --ig-bg:#000000; --ig-ink:#F5F5F5; --ig-muted:#A8A8A8;
  --chat-bg:#0E1A20; --bubble-in:#1F2C33; --bubble-out:#0B5A49; --chat-ink:#E9EDEF; --chat-meta:#8FA2AC;
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.025em}
h1 em,h2 em,h3 em{font-style:normal;color:var(--cherry)}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cherry);outline-offset:3px;border-radius:6px}
.eyebrow{font-size:.76rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:.88rem;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:2px 9px;white-space:nowrap}
.tag.demo{color:var(--gold)}
.tag.hot{color:var(--cherry-ink);background:var(--cherry);border-color:var(--cherry)}
.tag.save{color:var(--ok)}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-size:1.45rem;font-weight:600;text-decoration:none;letter-spacing:-.02em;white-space:nowrap}
.brand b{font-style:normal;font-weight:700;color:var(--cherry)}
.top-right{display:flex;align-items:center;gap:10px;min-width:0}
@media (max-width:420px){.top-right .tag.demo{display:none}}
.cart-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:.9rem;border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--surface)}
.cart-link span{background:var(--cherry);color:var(--cherry-ink);border-radius:99px;min-width:20px;height:20px;padding:0 5px;display:inline-grid;place-items:center;font-size:.75rem}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:15px 24px;font-weight:600;font-size:1rem;text-decoration:none;cursor:pointer;background:var(--cherry);color:var(--cherry-ink);transition:transform .15s ease, filter .15s ease}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:9px 16px;font-size:.9rem}
.btn.block{width:100%}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.link{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--cherry)}

/* capa */
.hero{padding-block:28px 40px;display:grid;gap:28px;align-items:center}
@media (min-width:860px){.hero{grid-template-columns:1.1fr .9fr;padding-block:56px 64px}}
.hero h1{font-size:clamp(2.3rem,9.5vw,4.4rem)}
.hero .lede{font-size:1.12rem;max-width:36ch;margin-top:16px;color:var(--muted)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:24px;align-items:center}
.kit{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.kit span{font-size:.82rem;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px}
.hero-stage{display:flex;justify-content:center;position:relative}
.sched{position:absolute;right:max(0px,calc(50% - 230px));bottom:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.8rem;box-shadow:0 18px 30px -18px rgba(90,29,75,.5);display:none}
.sched b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cherry)}
@media (min-width:500px){.sched{display:block}}

/* celular */
.phone{width:min(300px,100%);aspect-ratio:9/18.5;background:var(--phone);border-radius:38px;padding:10px;box-shadow:0 30px 60px -25px rgba(90,29,75,.55);position:relative;flex:none;max-width:100%}
.phone .screen{position:relative;width:100%;height:100%;border-radius:29px;overflow:hidden;background:var(--ig-bg)}
.phone .notch{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:84px;height:22px;background:var(--phone);border-radius:99px;z-index:5}

/* post de carrossel */
.ig{position:absolute;inset:0;display:flex;flex-direction:column;color:var(--ig-ink);font-size:13px;line-height:1.35;background:var(--ig-bg)}
.ig-top{padding:46px 12px 8px;font-weight:700;font-size:16px;font-family:var(--display)}
.ig-head{display:flex;align-items:center;gap:8px;padding:6px 12px}
.av{width:30px;height:30px;border-radius:50%;background:var(--cherry);display:grid;place-items:center;font-family:var(--display);font-weight:600;color:#fff;flex:none;box-shadow:0 0 0 2px var(--ig-bg),0 0 0 3.5px #C13584}
.ig-head b{font-size:13px}
.ig-head small{display:block;color:var(--ig-muted);font-size:11px}
.slides{position:relative;aspect-ratio:4/5;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:18px;gap:8px;transition:transform .45s ease}
.slide .big{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.1;text-wrap:balance}
.slide.cover{background:linear-gradient(155deg,#B0123C,#5A1D4B);color:#fff}
.slide.prod{background:#F4DCE4;color:#2B0F24;align-items:center;text-align:center}
.slide.prod .art{width:58%;aspect-ratio:1}
.slide.prod .art svg{width:100%;height:100%}
.slide.prod b{font-family:var(--display);font-size:1.3rem}
.slide.prod span{font-weight:700}
.slide.prod small{background:#fff;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:600}
.slide.cta{background:#2B0F24;color:#fff}
.slide .counter{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:99px;padding:2px 8px}
.ig-bar{display:flex;align-items:center;gap:12px;padding:8px 12px 4px}
.ig-bar i{width:20px;height:20px;border:2px solid var(--ig-ink);border-radius:50%}
.ig-dots{flex:1;display:flex;justify-content:center;gap:4px;margin-right:64px}
.ig-dots button{width:6px;height:6px;border-radius:50%;border:0;padding:0;background:var(--ig-muted);opacity:.45;cursor:pointer}
.ig-dots button.on{background:#0095F6;opacity:1}
.ig-cap{padding:2px 12px;font-size:12.5px}
.ig-cap b{font-weight:700}
.ig-cap .more{color:var(--ig-muted)}

/* reel */
.reel{position:absolute;inset:0;color:#fff;background:linear-gradient(160deg,#6E1440 0%,#2A0A22 70%)}
.reel .scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:56px 22px 90px;gap:14px;opacity:0;transition:opacity .5s ease}
.reel .scene.on{opacity:1}
.reel .big,.st-frame .big{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.12;text-wrap:balance}
.reel .sub{font-size:14px;opacity:.85}
.reel .pill{align-self:flex-start;background:#fff;color:#2B0F24;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pick{border-radius:7px;overflow:hidden;background:rgba(255,255,255,.14);text-align:center;font-size:10.5px}
.pick .art{aspect-ratio:1;display:grid;place-items:center}
.pick .art svg{width:60%;height:60%}
.pick div:last-child{padding:3px 2px 4px;font-weight:600}
.reel-ui{position:absolute;left:14px;right:60px;bottom:16px;font-size:12px;z-index:3}
.reel-ui b{display:block;font-size:13px}
.reel-side{position:absolute;right:12px;bottom:70px;display:flex;flex-direction:column;gap:14px;font-size:11px;text-align:center;z-index:3}
.reel-side i{display:block;width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin:0 auto 3px}
.reel-top{position:absolute;top:46px;left:16px;font-weight:700;z-index:3;font-size:15px}
.reel-dots{position:absolute;top:50px;right:14px;display:flex;gap:4px;z-index:3}
.reel-dots button{width:8px;height:8px;border-radius:50%;border:0;background:rgba(255,255,255,.4);padding:0;cursor:pointer}
.reel-dots button.on{background:#fff}

/* stories */
.stories{position:absolute;inset:0;color:#fff;background:#5A1D4B}
.st-bars{position:absolute;top:40px;left:12px;right:12px;display:flex;gap:4px;z-index:4}
.st-bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.st-bars span i{display:block;height:100%;width:0;background:#fff}
.st-bars span.done i{width:100%}
.st-bars span.now i{animation:fill var(--dur,4s) linear forwards}
@keyframes fill{to{width:100%}}
.st-who{position:absolute;top:52px;left:14px;display:flex;align-items:center;gap:8px;z-index:4;font-size:12.5px;font-weight:600}
.st-who .av{width:26px;height:26px;font-size:12px;box-shadow:none}
.st-frame{position:absolute;inset:0;padding:96px 20px 40px;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.poll{background:#fff;color:#2B0F24;border-radius:14px;padding:10px;display:grid;gap:6px;font-weight:700;font-size:14px}
.poll div{border:1.5px solid #E8D5DE;border-radius:10px;padding:8px}
.slider{background:#fff;color:#2B0F24;border-radius:14px;padding:14px;font-weight:700}
.slider .track{height:8px;border-radius:9px;background:linear-gradient(90deg,#F4DCE4,#B0123C);margin:10px 0 6px;position:relative}
.slider .track i{position:absolute;left:58%;top:50%;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #B0123C;transform:translate(-50%,-50%)}
.slider small{display:flex;justify-content:space-between;font-size:12px;color:#7A5670}
.st-link{align-self:center;background:#fff;color:#0F6E5A;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.st-tap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 2fr;z-index:3}
.st-tap button{background:none;border:0;cursor:pointer}

/* painéis de legendas e calendário */
.sheet{width:100%;max-width:440px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.cap-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.cap-card .eyebrow{display:block;margin-bottom:6px}
.cap-card p{font-size:.94rem;white-space:pre-line}
.cap-card .tags{color:var(--muted);font-size:.85rem;margin-top:6px}
.cal{list-style:none;margin:0;padding:0;display:grid}
.cal li{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.cal li:first-child{border-top:0}
.cal .d{text-align:center;line-height:1.05}
.cal .d small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.cal .d b{font-family:var(--display);font-size:1.6rem}
.cal .what{min-width:0}
.cal .what b{display:block;font-size:.95rem}
.chip{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-right:6px}
.chip.carrossel{background:var(--blush);color:var(--cherry)}
.chip.video{background:var(--ink);color:var(--paper)}
.chip.stories{border:1.5px solid var(--plum);color:var(--plum)}

/* seções */
section.block{padding-block:40px;border-top:1px solid var(--line)}
#exemplos{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 12px;margin-bottom:22px}
.sec-head h2{font-size:clamp(1.6rem,6vw,2.4rem)}
.sec-head p{color:var(--muted);max-width:44ch}

.packs{display:grid;gap:14px}
@media (min-width:860px){.packs{grid-template-columns:repeat(3,1fr);align-items:start}}
.pack{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;min-width:0}
.pack.star{border:2px solid var(--cherry)}
.pack .head{display:flex;justify-content:space-between;align-items:start;gap:10px}
.pack h3{font-size:2.3rem}
.pack .call{color:var(--muted)}
.pack ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.pack li{display:grid;grid-template-columns:32px 1fr;gap:6px;align-items:baseline}
.pack li b{font-family:var(--display);font-size:1.25rem;color:var(--cherry);text-align:right}
.price{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1}
.was{text-decoration:line-through;color:var(--muted);font-size:.95rem;margin-right:6px}
.promo-line{font-size:.88rem;color:var(--ok);font-weight:600}
.pack .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}

.promos{display:grid;gap:10px}
@media (min-width:760px){.promos{grid-template-columns:repeat(2,1fr)}}
.promo{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--cherry);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.promo .pct{font-family:var(--display);font-weight:600;font-size:2rem;color:var(--cherry);line-height:1;min-width:64px;text-align:center}
.promo b{display:block}
.promo span{color:var(--muted);font-size:.9rem}

.items{display:grid;gap:10px}
@media (min-width:760px){.items{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.items{grid-template-columns:repeat(3,1fr)}}
.item{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.item h3{font-size:1.5rem}
.item p{color:var(--muted);font-size:.93rem;flex:1}
.item .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}

.themes{display:grid;gap:12px}
@media (min-width:760px){.themes{grid-template-columns:repeat(3,1fr)}}
.theme{padding:18px 0;border-top:2px solid var(--ink)}
.theme h3{font-size:1.3rem}
.theme p{color:var(--muted);margin-top:6px;font-size:.95rem}
.theme small{display:block;margin-top:8px;font-weight:600;font-size:.82rem}

.steps{display:grid;gap:12px;counter-reset:s;padding:0;margin:0;list-style:none}
@media (min-width:760px){.steps{grid-template-columns:repeat(4,1fr)}}
.steps li{counter-increment:s;padding:16px 0;border-top:2px solid var(--ink)}
.steps li::before{content:counter(s);font-family:var(--display);font-size:2rem;color:var(--cherry);display:block;line-height:1;margin-bottom:6px}
.steps b{display:block}
.steps span{color:var(--muted);font-size:.93rem}

/* exemplos */
.tabs{display:flex;gap:6px;margin:0 0 18px;overflow-x:auto;padding-bottom:4px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.demo{display:grid;gap:24px;align-items:center}
@media (min-width:760px){.demo{grid-template-columns:auto 1fr}}
.demo > .phone{margin:0 auto}
.demo-note h3{font-size:1.9rem}
.demo-note p{color:var(--muted);margin-top:8px;max-width:44ch}
.demo-note ul{margin:14px 0 0;padding-left:20px;display:grid;gap:6px}

/* detalhe */
.detail-head{padding-block:24px 18px}
.back{font-weight:600;text-decoration:none;font-size:.92rem;color:var(--muted)}
.detail-head h1{font-size:clamp(2.3rem,9vw,4rem);margin-top:12px}
.detail-head .goal{font-size:1.1rem;max-width:46ch;margin-top:12px}
.two{display:grid;gap:14px}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.list-card{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--surface)}
.list-card h3{font-size:1.7rem;margin-bottom:12px}
.list-card ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.list-card li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.list-card li::before{content:"";width:10px;height:10px;margin-top:7px;border-radius:50%;background:var(--cherry)}
.list-card.team li::before{background:transparent;border:2px solid var(--plum)}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:18px;font-size:.92rem}
.facts div{min-width:0}
.facts b{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* pedido */
.page-head{padding-block:24px 18px}
.page-head h1{font-size:clamp(2rem,8vw,3.2rem)}
.page-head p{color:var(--muted);margin-top:8px}
.stepper{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem;font-weight:600;margin-bottom:14px;color:var(--muted)}
.stepper span{padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.stepper span.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.order{display:grid;gap:24px;align-items:start}
@media (min-width:860px){.order{grid-template-columns:minmax(0,1fr) 340px}}
.group-title{font-family:var(--display);font-size:1.6rem;margin:6px 0 4px}
.group-hint{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;margin-bottom:10px}
.opt.on{border-color:var(--cherry);box-shadow:0 0 0 3px color-mix(in srgb,var(--cherry) 16%,transparent)}
.opt input{width:22px;height:22px;accent-color:var(--cherry);margin:0}
.opt b{display:block;font-size:1.05rem}
.opt small{color:var(--muted);display:block;line-height:1.35;margin-top:2px}
.opt .p{font-weight:700;white-space:nowrap;text-align:right}
.opt .p small{color:var(--ok);font-weight:600}
.opt.off{opacity:.5;cursor:not-allowed}

const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const fmt = v => BRL.format(v).replace(/ /g, " ");
const round2 = v => Math.round(v * 100) / 100;
const getItem = id => CONFIG.itens.find(i => i.id === id) || null;
const getPublico = id => CONFIG.publicos.find(p => p.id === id) || null;
const getPacote = id => CONFIG.publicos.flatMap(pb => pb.planos).find(p => p.id === id) || null;
const getTema = id => CONFIG.publicos.flatMap(pb => pb.temas).find(t => t.id === id) || null;
function qtdLabel(item, q) { return `${q} ${q === 1 ? item.unidade[0] : item.unidade[1]}`; }
function valorAvulso(p) { return Object.entries(p.itens).reduce((s, [id, q]) => s + (getItem(id)?.preco || 0) * q, 0); }
function economiaPacote(p) { return Math.max(0, valorAvulso(p) - p.preco); }
function incluso(pacoteId, itemId) { const p = getPacote(pacoteId); return (p && p.itens[itemId]) || 0; }
function maxExtra(pacoteId, itemId) { const it = getItem(itemId); return it ? Math.max(0, it.max - incluso(pacoteId, itemId)) : 0; }

function isoDay(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function promoVigente(p, hoje) { return p.ativa && (!p.ate || isoDay(hoje) <= p.ate); }
function promosAtivas(hoje = new Date()) { return CONFIG.promocoes.filter(p => promoVigente(p, hoje)); }
function dataCurta(iso) { const [, m, d] = iso.split("-"); return `${d}/${m}`; }

/* Deixa o carrinho coerente com o catálogo: remove o que não existe, está indisponível,
   passa do limite ou pertence a outro perfil. As peças avulsas valem para todos os perfis. */
function sanitizeCart(cart) {
  const c = { perfil: null, pacote: null, extras: {}, temas: [] };
  const pb = cart && getPublico(cart.perfil);
  if (pb) c.perfil = pb.id;
  const p = pb && pb.planos.find(x => x.id === cart.pacote);
  if (p && p.disponivel) c.pacote = p.id;
  for (const [id, q] of Object.entries((cart && cart.extras) || {})) {
    const it = getItem(id);
    if (!it || !it.disponivel) continue;
    const n = Math.min(Math.max(0, Math.floor(Number(q) || 0)), maxExtra(c.pacote, id));
    if (n > 0) c.extras[id] = n;
  }
  c.temas = pb ? [...new Set(cart.temas || [])].filter(id => pb.temas.some(t => t.id === id)) : [];
  return c;
}
function setPerfil(cart, id) { return sanitizeCart({ ...cart, perfil: id || null }); }
function setPacote(cart, id) { return sanitizeCart({ ...cart, pacote: id || null }); }
function addExtra(cart, id, delta) { const ex = { ...cart.extras, [id]: (cart.extras[id] || 0) + delta }; return sanitizeCart({ ...cart, extras: ex }); }
function toggleTema(cart, id) { const has = cart.temas.includes(id); return sanitizeCart({ ...cart, temas: has ? cart.temas.filter(t => t !== id) : [...cart.temas, id] }); }

function calc(cart, hoje = new Date()) {
  const pacote = getPacote(cart.pacote);
  const extras = Object.entries(cart.extras).map(([id, qtd]) => { const item = getItem(id); return { item, qtd, valor: item.preco * qtd }; });
  const subPacote = pacote ? pacote.preco : 0;
  const subExtras = extras.reduce((s, e) => s + e.valor, 0);
  const subtotal = subPacote + subExtras;
  const descontos = [];
  for (const pr of promosAtivas(hoje)) {
    if (pr.tipo === "percentual") {
      const base = pr.aplicaEm === "pacote" ? subPacote : pr.aplicaEm === "extras" ? subExtras : subtotal;
      if (base > 0) descontos.push({ promo: pr, valor: round2(base * pr.valor / 100), detalhe: `${pr.valor}% ${pr.aplicaEm === "pacote" ? "no plano" : pr.aplicaEm === "extras" ? "nas peças extras" : "no pedido"}` });
    } else if (pr.tipo === "leve-pague") {
      const e = extras.find(x => x.item.id === pr.item);
      if (e) { const gratis = Math.floor(e.qtd / pr.leve) * (pr.leve - pr.pague); if (gratis > 0) descontos.push({ promo: pr, valor: round2(gratis * e.item.preco), detalhe: `${gratis} ${gratis === 1 ? e.item.unidade[0] : e.item.unidade[1]} por conta da casa` }); }
    }
  }
  const desconto = round2(descontos.reduce((s, d) => s + d.valor, 0));
  const total = round2(Math.max(0, subtotal - desconto));
  const economiaTotal = round2((pacote ? economiaPacote(pacote) : 0) + desconto);
  const pecas = (pacote ? Object.values(pacote.itens).reduce((a, b) => a + b, 0) : 0) + extras.reduce((s, e) => s + e.qtd, 0);
  return { pacote, extras, subtotal, descontos, desconto, total, economiaTotal, pecas, vazio: !pacote && !extras.length };
}

function digits(s) { return String(s || "").replace(/\D/g, ""); }
function normalizePhone(s) { let d = digits(s); if ((d.length === 12 || d.length === 13) && d.startsWith("55")) d = d.slice(2); return d; }
function formatPhone(s) {
  const d = normalizePhone(s);
  if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return String(s || "").trim();
}
function normalizeInstagram(s) {
  let v = String(s || "").trim();
  if (!v) return "";
  v = v.replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").replace(/[/?#].*$/, "").replace(/^@+/, "");
  return v ? "@" + v : "";
}
function validateCustomer(d, publico) {
  const e = {};
  if (String(d.nome || "").trim().length < 2) e.nome = "Informe seu nome.";
  if (!String(d.loja || "").trim()) e.loja = `Informe o ${(publico ? publico.negocioCampo : "Nome da loja").toLowerCase()}.`;
  const p = normalizePhone(d.whatsapp);
  if (!p) e.whatsapp = "Informe o WhatsApp com DDD.";
  else if (p.length < 10 || p.length > 11 || Number(p.slice(0,2)) < 11) e.whatsapp = "Confira o número: use DDD + número, como (55) 99999-8888.";
  const ig = normalizeInstagram(d.instagram);
  if (ig && !/^@[A-Za-z0-9._]{1,30}$/.test(ig)) e.instagram = "Use só o @ da loja, como @sualoja.";
  return e;
}

  L.push("", "Aguardo o retorno para fechar o pedido.");
  return L.join("\n");

    bars.forEach((b, k) => b.className = k < i ? "done" : "");
    void bars[i].offsetWidth; bars[i].className = reduce ? "done" : "now"; bars[i].style.setProperty("--dur", DUR + "ms");
    clearTimeout(t); if (!reduce) t = later(() => show(i + 1), DUR);
  };
  root.querySelectorAll("[data-dir]").forEach(b => b.addEventListener("click", () => show(i + +b.dataset.dir)));
  show(0);
}

    <div class="final">
      ${link ? `<a class="btn block" href="${esc(link)}" target="_blank" rel="noopener" id="sendBtn">Enviar solicitação</a><p class="hint">Abre o WhatsApp com a mensagem pronta. Você confere e toca em enviar.</p>`
             : `<button class="btn block" type="button" id="sendBtn">Enviar solicitação</button><div class="notice"><b>Demonstração.</b> O número de WhatsApp ainda não foi configurado, então o botão copia o resumo para você colar onde quiser.</div>`}
      <details><summary style="cursor:pointer;font-weight:600;margin-top:6px">Ver mensagem que será enviada</summary><div class="msg-preview" id="msgText">${esc(text)}</div></details>
      ${link ? `<button class="btn ghost block" type="button" id="copyBtn">Copiar resumo</button>` : ""}
    </div></div>${foot()}`;
}

/* ---------- Barra fixa ---------- */
function renderBar(rt) {
  const r = calc(state.cart), bar = $("#bar");
  $("#cartCount").textContent = r.pecas;
  if (rt === "resumo" || !state.cart.perfil) { bar.hidden = true; return; }
  let label, href, dis = false, sub;
  const pecas = `${r.pecas} ${r.pecas === 1 ? "peça" : "peças"}`;
  if (rt === "pedido") { label = "Continuar"; href = "#dados"; dis = r.vazio; sub = r.vazio ? "Escolha um plano ou peças" : `${pecas}${r.desconto ? ` · − ${fmt(r.desconto)} em promoções` : ""}`; }
  else if (rt === "dados") { label = "Ver resumo"; href = "#resumo"; sub = `${pecas} · total`; }
  else { label = r.vazio ? "Montar meu pedido" : "Ver pedido"; href = "#pedido"; sub = r.vazio ? "Comece por um plano" : `${pecas} no pedido`; }
  bar.hidden = false;
  bar.innerHTML = `<div class="wrap"><div class="t"><small>${esc(sub)}</small><b class="num" data-total>${fmt(r.total)}</b></div><a class="btn" href="${href}" ${dis ? 'aria-disabled="true"' : ""} id="barBtn">${label}</a></div>`;
}

/* ---------- Rotas ---------- */
function route() {
  const h = (location.hash || "#inicio").slice(1);
  if (["pedido","dados","resumo","exemplos"].includes(h) || h.startsWith("pacote-")) return h;
  return "inicio";
}
function render(scroll = true) {
  clearTimers();
  const rt = route();
  if (!state.cart.perfil && rt !== "inicio") { location.replace("#inicio"); return; }
  if ((rt === "dados" || rt === "resumo") && calc(state.cart).vazio) { location.replace("#pedido"); return; }
  if (rt === "resumo" && Object.keys(validateCustomer(state.customer, publico())).length) { formErrors = validateCustomer(state.customer, publico()); location.replace("#dados"); return; }
  const app = $("#app");
  app.innerHTML = rt === "pedido" ? viewOrder() : rt === "dados" ? viewData() : rt === "resumo" ? viewReview() : rt.startsWith("pacote-") ? viewPacote(rt.slice(7)) : viewHome();
  renderBar(rt);
  app.querySelectorAll("[data-demo]").forEach(el => { const ex = EXEMPLOS[el.dataset.demo]; ex && ex.mount && ex.mount(el); });
  if (rt === "exemplos" && scroll) { $("#exemplos")?.scrollIntoView(); return; }
  if (scroll) window.scrollTo(0, 0);
}
const flashTotal = () => document.querySelectorAll("[data-total]").forEach(el => { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); });
function update(cart, msg) { state.cart = cart; save(); render(false); flashTotal(); if (msg) toast(msg); }

/* ---------- Eventos ---------- */
document.addEventListener("click", e => {
  const pf = e.target.closest("[data-perfil]");
  if (pf) {
    const antes = state.cart, cart = setPerfil(antes, pf.dataset.perfil), pb = getPublico(cart.perfil);
    if (antes.perfil === cart.perfil) return;
    const saiu = (antes.pacote && !cart.pacote) || antes.temas.length > cart.temas.length;
    state.prevTema = null; state.cart = cart; save();
    if (!antes.perfil) { if (route() === "inicio") render(); else location.hash = "#inicio"; return; }
    render(false); toast(saiu ? `Agora: ${pb.nome}. O plano e os temas do outro perfil saíram do pedido.` : `Agora: ${pb.nome}.`); return;
  }
  const pv = e.target.closest("[data-prev]");
  if (pv) {
    state.prevTema = pv.dataset.prev;
    if (pv.dataset.ir) { if (!["carrossel", "stories"].includes(state.tab)) state.tab = "carrossel"; render(false); $("#exemplos")?.scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); }
    else { const y = scrollY; render(false); scrollTo(0, y); }
    return;
  }
  const pk = e.target.closest("[data-pacote]");
  if (pk) { state.cart = setPacote(state.cart, pk.dataset.pacote); save(); location.hash = "#pedido"; return; }
  const ad = e.target.closest("[data-add]");
  if (ad) { const id = ad.dataset.add, before = state.cart.extras[id] || 0, cart = addExtra(state.cart, id, 1);
    update(cart, (cart.extras[id] || 0) > before ? `${getItem(id).nome} adicionado · total ${fmt(calc(cart).total)}` : "Limite desta peça atingido."); return; }
  const qb = e.target.closest("[data-qty]");
  if (qb) { const cart = addExtra(state.cart, qb.dataset.qty, +qb.dataset.d); update(cart, `Total ${fmt(calc(cart).total)}`); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { state.tab = tb.dataset.tab; const y = scrollY; render(false); scrollTo(0, y); return; }
  if (e.target.closest("#barBtn") && route() === "dados") { e.preventDefault(); $("#dataForm")?.requestSubmit(); return; }
  if (e.target.id === "sendBtn" && !digits(CONFIG.whatsapp)) { copySummary(); return; }
  if (e.target.id === "copyBtn") { copySummary(); return; }
});
document.addEventListener("change", e => {
  if (e.target.name === "pacote") update(setPacote(state.cart, e.target.value));
  else if (e.target.dataset.tema) update(toggleTema(state.cart, e.target.dataset.tema));
});
document.addEventListener("input", e => { if (e.target.form && e.target.form.id === "dataForm") { state.customer[e.target.name] = e.target.value; save(); } });
document.addEventListener("submit", e => {
  if (e.target.id !== "dataForm") return;
  e.preventDefault();
  const f = e.target;
  ["nome","loja","whatsapp","instagram"].forEach(k => state.customer[k] = f[k].value);
  formErrors = validateCustomer(state.customer, publico());
  if (Object.keys(formErrors).length) { render(false); $("#" + Object.keys(formErrors)[0])?.focus(); toast("Confira os campos destacados."); return; }
  state.customer.whatsapp = formatPhone(state.customer.whatsapp);
  state.customer.instagram = normalizeInstagram(state.customer.instagram);
  save(); formErrors = {}; location.hash = "#resumo";
});
async function copySummary() {
  const text = buildSummary(state.cart, state.customer);
  try { await navigator.clipboard.writeText(text); toast("Resumo copiado."); }
  catch {
    const d = document.querySelector("details"); if (d) d.open = true;
    const el = $("#msgText"); if (el) { const rg = document.createRange(); rg.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); }
    toast("Texto selecionado. Use copiar do seu aparelho.");
  }
}
window.addEventListener("hashchange", () => { if (route() !== "dados") formErrors = {}; render(); });
render(false);
</script>
